name: Despliegue de Portafolio

on:
  push:
    branches: [ main ]
    # Documentación del repositorio que no forma parte del sitio
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

# Si llegan dos pushes seguidos, se cancela el despliegue anterior en curso
concurrency:
  group: despliegue-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish src/PortafolioBlog/PortafolioBlog.csproj -c Release -o release

      - name: Fix for GitHub Pages
        run: |
          cp release/wwwroot/index.html release/wwwroot/404.html
          touch release/wwwroot/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: release/wwwroot
          branch: gh-pages