name: Despliegue de Portafolio

on:
  push:
    branches: [ main ]
    # Documentación del repositorio que no forma parte del sitio
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:
  # Todos los días a las 6:00 de Costa Rica (12:00 UTC): publica las entradas cuya fecha ya llegó.
  # Si no hay nada nuevo, el despliegue no cambia nada en gh-pages.
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write

# Si llegan dos pushes seguidos, se cancela el despliegue anterior en curso
concurrency:
  group: despliegue-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish src/PortafolioBlog/PortafolioBlog.csproj -c Release -o release

      - name: Fix for GitHub Pages
        run: |
          cp release/wwwroot/index.html release/wwwroot/404.html
          touch release/wwwroot/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: release/wwwroot
          branch: gh-pages